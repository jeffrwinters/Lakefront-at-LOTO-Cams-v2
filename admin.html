<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lakefront at LOTO - Operations Center</title>
<style>
:root{
--bg:#0b1226;--panel:#132046;--panel2:#1a2a58;--text:#fff;--muted:#c6d0ee;
--green:#2ecc71;--red:#ff6b6b;--yellow:#f7c948;
}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#08101f,#0b1226);color:var(--text);margin:0;padding:20px}
.header{background:var(--panel);padding:18px;border-radius:16px;margin-bottom:16px}
.header h1{margin:0}
.header p{margin:6px 0 0;color:var(--muted)}
.toolbar{position:sticky;top:10px;background:rgba(11,18,38,.95);padding:10px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:10;margin-bottom:16px}
button,input{padding:10px;border-radius:10px;border:1px solid #334}
button{cursor:pointer;background:var(--panel2);color:white}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);padding:14px;border-radius:14px;text-align:center}
.card .num{font-size:28px;font-weight:bold}
.venue{background:var(--panel);border-radius:14px;margin-bottom:14px;overflow:hidden}
.venuehead{padding:12px 16px;font-weight:bold;background:#20346d;cursor:pointer}
.cams{padding:10px}
.cam{background:#101b3c;border-radius:12px;padding:12px;margin-bottom:10px}
.cam input,.cam select{margin:3px;width:calc(50% - 12px)}
.status-active{border-left:5px solid var(--green)}
.status-disabled{border-left:5px solid var(--red)}
.actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="header">
<h1>Lakefront at LOTO</h1>
<p>Operations Center</p>
</div>

<div class="toolbar">
<button>Add Camera</button>
<button>Check All Cameras</button>
<button>Show Failed</button>
<button>Disable Failed</button>
<button>Download cams.json</button>
<input placeholder="Search cameras...">
</div>

<div class="cards">
<div class="card"><div class="num">32</div>Total Cameras</div>
<div class="card"><div class="num">29</div>Active</div>
<div class="card"><div class="num">3</div>Failed</div>
<div class="card"><div class="num">12</div>Favorites</div>
</div>

<div class="venue">
<div class="venuehead">▼ Dog Days (4)</div>
<div class="cams">
<div class="cam status-active">
<div><strong>Pool</strong></div>
<div class="small">🟢 Active | ✅ Reachable</div>
<div class="actions">
<button>Open</button><button>Check</button><button>Edit</button>
</div>
</div>
</div>
</div>

<p class="small">This is a visual redesign template matching the consumer site styling. Wire this styling into your current admin_v3 functionality.</p>
</body>
</html>
